<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Estiqatsy App</title>
  <!-- SDK Ufficiale Telegram WebApp -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0f172a);
      --text: var(--tg-theme-text-color, #f8fafc);
      --hint: var(--tg-theme-hint-color, #94a3b8);
      --card-bg: var(--tg-theme-secondary-bg-color, #1e293b);
      --btn-bg: var(--tg-theme-button-color, #3b82f6);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --accent: #f59e0b;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Profilo Card */
    .profile-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      color: #fff;
    }

    .profile-info h2 {
      font-size: 17px;
      font-weight: 700;
    }

    .profile-info p {
      font-size: 12px;
      color: var(--hint);
    }

    .badge-plan {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(245, 158, 11, 0.2);
      color: var(--accent);
      margin-top: 4px;
    }

    /* Statistiche Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat-box {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-box .icon {
      font-size: 20px;
      margin-bottom: 2px;
    }

    .stat-box .val {
      font-size: 20px;
      font-weight: 800;
    }

    .stat-box .lbl {
      font-size: 11px;
      color: var(--hint);
      text-transform: uppercase;
    }

    /* Eroe Card */
    .hero-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--hint);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
    }

    .bar-container {
      margin-bottom: 12px;
    }

    .bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .bar-bg {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }

    .bar-fill-hp {
      height: 100%;
      background: var(--danger);
      width: 100%;
      transition: width 0.3s ease;
    }

    .hero-stats-row {
      display: flex;
      justify-content: space-around;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .hero-stat {
      text-align: center;
    }

    .hero-stat .val {
      font-size: 15px;
      font-weight: 700;
    }

    .hero-stat .lbl {
      font-size: 11px;
      color: var(--hint);
    }

    /* Azioni */
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: auto;
      padding-top: 10px;
    }

    .btn {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-secondary {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Spinner */
    #loading {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 999;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--btn-bg);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <p style="font-size: 13px; color: var(--hint);">Connessione al database Estiqatsy...</p>
  </div>

  <div class="app-container">
    <!-- Profilo -->
    <div class="profile-card">
      <div class="avatar" id="avatarLetter">E</div>
      <div class="profile-info">
        <h2 id="userName">Giocatore</h2>
        <p id="userTag">@username</p>
        <span class="badge-plan" id="userPlan">Piano: Caricamento...</span>
      </div>
    </div>

    <!-- Saldo & Punti -->
    <div class="stats-grid">
      <div class="stat-box">
        <div class="icon">🪙</div>
        <div class="val" id="megoinVal">0</div>
        <div class="lbl">Megoin Saldo</div>
      </div>
      <div class="stat-box">
        <div class="icon">🎖️</div>
        <div class="val" id="puntiVal">0</div>
        <div class="lbl">Punti Fedeltà</div>
      </div>
    </div>

    <!-- Eroe -->
    <div class="hero-card">
      <div class="section-title">
        <span>⚔️ Scheda Eroe</span>
        <span id="heroClass" style="font-size: 12px; color: var(--accent);">In caricamento...</span>
      </div>

      <div class="bar-container">
        <div class="bar-label">
          <span>Punti Vita</span>
          <span id="hpText">-- / --</span>
        </div>
        <div class="bar-bg">
          <div class="bar-fill-hp" id="hpBar"></div>
        </div>
      </div>

      <div class="hero-stats-row">
        <div class="hero-stat">
          <div class="val" id="heroFor">--</div>
          <div class="lbl">🥊 FOR</div>
        </div>
        <div class="hero-stat">
          <div class="val" id="heroDes">--</div>
          <div class="lbl">🤸 DES</div>
        </div>
        <div class="hero-stat">
          <div class="val" id="heroInt">--</div>
          <div class="lbl">🧠 INT</div>
        </div>
        <div class="hero-stat">
          <div class="val" id="heroOro">--</div>
          <div class="lbl">💰 Oro</div>
        </div>
      </div>
    </div>

    <!-- Pulsanti -->
    <div class="action-grid">
      <button class="btn btn-secondary" onclick="loadDataFromGAS()">
        🔄 Ricarica
      </button>
      <button class="btn" onclick="closeApp()">
        💬 Torna alla Chat
      </button>
    </div>
  </div>

<script>
  // URL della tua Web App Google Apps Script
  const GAS_URL = "https://script.google.com/macros/s/AKfycbyeCWHM9X4ycwWT7IOMwg24pySL78bJT5BRyiIR5eb0UJALWuaORzfJ2lkqLrjLv0xN/exec";

  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) {
    try {
      tg.expand();
      tg.ready();
    } catch(e) {}
  }

function loadDataFromGAS() {
    const loader = document.getElementById("loading");
    loader.style.display = "flex";

    // 1. Controlla presenza initData
    const initDataRaw = (tg && tg.initData) ? tg.initData : "";

    if (!initDataRaw) {
      loader.innerHTML = `
        <div style="text-align: center; padding: 20px;">
          <div style="font-size: 40px; margin-bottom: 10px;">🔒</div>
          <h3 style="color: var(--danger); margin-bottom: 8px;">Accesso Riservato</h3>
          <p style="font-size: 13px; color: var(--hint);">Questa Web App può essere aperta solo all'interno del bot Telegram ufficiale.</p>
        </div>
      `;
      return;
    }

    // 2. Chiamata sicura (usando text/plain per bypassare i controlli CORS complessi)
    fetch(GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        isMiniAppCall: true,
        initData: initDataRaw,
        action: "GET_APP_DATA"
      })
    })
    .then(async (res) => {
      const text = await res.text();
      try {
        return JSON.parse(text);
      } catch(e) {
        throw new Error("Risposta non valida dal server: " + text.substring(0, 100));
      }
    })
    .then(data => {
      loader.style.display = "none";

      if (!data || !data.ok) {
        loader.style.display = "flex";
        loader.innerHTML = `
          <div style="text-align: center; padding: 20px;">
            <p style="color: var(--danger); font-weight: bold;">Errore Server:</p>
            <p style="font-size: 12px; color: var(--hint); margin-top: 6px;">${data.error || "Errore sconosciuto"}</p>
          </div>
        `;
        return;
      }

      // Visualizzazione dati profilo
      if (data.user) {
        document.getElementById("userName").innerText = data.user.nome || "Giocatore";
        document.getElementById("avatarLetter").innerText = (data.user.nome || "G").charAt(0).toUpperCase();
        document.getElementById("userTag").innerText = data.user.username ? (data.user.username.startsWith("@") ? data.user.username : "@" + data.user.username) : "ID: " + data.user.id;
        document.getElementById("megoinVal").innerText = data.user.megoin;
        document.getElementById("puntiVal").innerText = data.user.punti;
        document.getElementById("userPlan").innerText = "Piano: " + data.user.piano;
      }

      // Visualizzazione dati eroe
      if (data.hero) {
        const h = data.hero;
        document.getElementById("heroClass").innerText = h.classe || "Avventuriero";
        document.getElementById("hpText").innerText = h.pv + " / " + h.pvMax;
        const pct = Math.max(0, Math.min(100, Math.round((h.pv / h.pvMax) * 100)));
        document.getElementById("hpBar").style.width = pct + "%";

        document.getElementById("heroFor").innerText = (h.stats && h.stats.FORZA) || 10;
        document.getElementById("heroDes").innerText = (h.stats && h.stats.DESTREZZA) || 10;
        document.getElementById("heroInt").innerText = (h.stats && h.stats.INTELLIGENZA) || 10;
        document.getElementById("heroOro").innerText = (h.oro || 0) + " 🟡";
      }
    })
    .catch(err => {
      loader.innerHTML = `
        <div style="text-align: center; padding: 20px;">
          <p style="color: var(--danger); font-weight: bold;">Dettaglio Errore:</p>
          <p style="font-size: 12px; color: var(--hint); word-break: break-all; margin-top: 6px;">${err.message}</p>
        </div>
      `;
    });
  }

    // 2. Chiamata sicura al backend passando SOLO la stringa firmata
    fetch(GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // text/plain evita preflight CORS OPTIONS non supportati da GAS
      body: JSON.stringify({
        isMiniAppCall: true,
        initData: initDataRaw,
        action: "GET_APP_DATA"
      })
    })
    .then(res => res.json())
    .then(data => {
      loader.style.display = "none";

      if (!data || !data.ok) {
        alert(data.error || "Errore di autenticazione");
        return;
      }

      // Visualizzazione dati profilo
      if (data.user) {
        document.getElementById("userName").innerText = data.user.nome || "Giocatore";
        document.getElementById("avatarLetter").innerText = (data.user.nome || "G").charAt(0).toUpperCase();
        document.getElementById("userTag").innerText = data.user.username ? (data.user.username.startsWith("@") ? data.user.username : "@" + data.user.username) : "ID: " + data.user.id;
        document.getElementById("megoinVal").innerText = data.user.megoin;
        document.getElementById("puntiVal").innerText = data.user.punti;
        document.getElementById("userPlan").innerText = "Piano: " + data.user.piano;
      }

      // Visualizzazione scheda eroe
      if (data.hero) {
        const h = data.hero;
        document.getElementById("heroClass").innerText = h.classe || "Avventuriero";
        document.getElementById("hpText").innerText = h.pv + " / " + h.pvMax;
        const pct = Math.max(0, Math.min(100, Math.round((h.pv / h.pvMax) * 100)));
        document.getElementById("hpBar").style.width = pct + "%";

        document.getElementById("heroFor").innerText = (h.stats && h.stats.FORZA) || 10;
        document.getElementById("heroDes").innerText = (h.stats && h.stats.DESTREZZA) || 10;
        document.getElementById("heroInt").innerText = (h.stats && h.stats.INTELLIGENZA) || 10;
        document.getElementById("heroOro").innerText = (h.oro || 0) + " 🟡";
      }
    })
    .catch(err => {
      loader.innerHTML = `
        <div style="text-align: center; padding: 20px;">
          <p style="color: var(--danger);">Impossibile contattare il server. Riprova più tardi.</p>
        </div>
      `;
    });
  }

  function closeApp() {
    if (tg) tg.close();
  }

  window.onload = loadDataFromGAS;
</script>
