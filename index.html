<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Estiqatsy App</title>
  <!-- SDK Ufficiale Telegram WebApp -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0f172a);
      --text: var(--tg-theme-text-color, #f8fafc);
      --hint: var(--tg-theme-hint-color, #94a3b8);
      --card-bg: var(--tg-theme-secondary-bg-color, #1e293b);
      --btn-bg: var(--tg-theme-button-color, #3b82f6);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --accent: #f59e0b;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Profilo Card */
    .profile-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      color: #fff;
    }

    .profile-info h2 {
      font-size: 17px;
      font-weight: 700;
    }

    .profile-info p {
      font-size: 12px;
      color: var(--hint);
    }

    .badge-plan {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(245, 158, 11, 0.2);
      color: var(--accent);
      margin-top: 4px;
    }

    /* Statistiche Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat-box {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-box .icon {
      font-size: 20px;
      margin-bottom: 2px;
    }

    .stat-box .val {
      font-size: 20px;
      font-weight: 800;
    }

    .stat-box .lbl {
      font-size: 11px;
      color: var(--hint);
      text-transform: uppercase;
    }

    /* Eroe Card */
    .hero-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--hint);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
    }

    .bar-container {
      margin-bottom: 12px;
    }

    .bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .bar-bg {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }

    .bar-fill-hp {
      height: 100%;
      background: var(--danger);
      width: 100%;
      transition: width 0.3s ease;
    }

    .hero-stats-row {
      display: flex;
      justify-content: space-around;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .hero-stat {
      text-align: center;
    }

    .hero-stat .val {
      font-size: 15px;
      font-weight: 700;
    }

    .hero-stat .lbl {
      font-size: 11px;
      color: var(--hint);
    }

    /* Azioni */
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: auto;
      padding-top: 10px;
    }

    .btn {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-secondary {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Spinner */
    #loading {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 999;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--btn-bg);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <p style="font-size: 13px; color: var(--hint);">Connessione al database Estiqatsy...</p>
  </div>

  <div class="app-container">
    <!-- Profilo -->
    <div class="profile-card">
      <div class="avatar" id="avatarLetter">E</div>
      <div class="profile-info">
        <h2 id="userName">Giocatore</h2>
        <p id="userTag">@username</p>
        <span class="badge-plan" id="userPlan">Piano: Caricamento...</span>
      </div>
    </div>

    <!-- Saldo & Punti -->
    <div class="stats-grid">
      <div class="stat-box">
        <div class="icon">🪙</div>
        <div class="val" id="megoinVal">0</div>
        <div class="lbl">Megoin Saldo</div>
      </div>
      <div class="stat-box">
        <div class="icon">🎖️</div>
        <div class="val" id="puntiVal">0</div>
        <div class="lbl">Punti Fedeltà</div>
      </div>
    </div>

    <!-- Eroe -->
    <div class="hero-card">
      <div class="section-title">
        <span>⚔️ Scheda Eroe</span>
        <span id="heroClass" style="font-size: 12px; color: var(--accent);">In caricamento...</span>
      </div>

      <div class="bar-container">
        <div class="bar-label">
          <span>Punti Vita</span>
          <span id="hpText">-- / --</span>
        </div>
        <div class="bar-bg">
          <div class="bar-fill-hp" id="hpBar"></div>
        </div>
      </div>

      <div class="hero-stats-row">
        <div class="hero-stat">
          <div class="val" id="heroFor">--</div>
          <div class="lbl">🥊 FOR</div>
        </div>
        <div class="hero-stat">
          <div class="val" id="heroDes">--</div>
          <div class="lbl">🤸 DES</div>
        </div>
        <div class="hero-stat">
          <div class="val" id="heroInt">--</div>
          <div class="lbl">🧠 INT</div>
        </div>
        <div class="hero-stat">
          <div class="val" id="heroOro">--</div>
          <div class="lbl">💰 Oro</div>
        </div>
      </div>
    </div>

    <!-- Pulsanti -->
    <div class="action-grid">
      <button class="btn btn-secondary" onclick="loadDataFromGAS()">
        🔄 Ricarica
      </button>
      <button class="btn" onclick="closeApp()">
        💬 Torna alla Chat
      </button>
    </div>
  </div>

  <script>
    // URL Web App di Google Apps Script (il tuo endpoint Logic.gs)
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyeCWHM9X4ycwWT7IOMwg24pySL78bJT5BRyiIR5eb0UJALWuaORzfJ2lkqLrjLv0xN/exec";

    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    const tgUser = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : null;
    const initDataRaw = tg ? tg.initData : "";

    if (tgUser) {
      const name = (tgUser.first_name || "") + " " + (tgUser.last_name || "");
      document.getElementById("userName").innerText = name.trim() || "Giocatore";
      document.getElementById("userTag").innerText = tgUser.username ? ("@" + tgUser.username) : "ID: " + tgUser.id;
      document.getElementById("avatarLetter").innerText = (tgUser.first_name || "E").charAt(0).toUpperCase();
    }

    // Chiamata Fetch protetta: usa text/plain per aggirare il blocco CORS preflight di Google
    function loadDataFromGAS() {
      document.getElementById("loading").style.display = "flex";

      const payload = JSON.stringify({
        isMiniAppCall: true,
        initData: initDataRaw,
        action: "GET_APP_DATA"
      });

      fetch(GAS_URL, {
        method: "POST",
        body: payload
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById("loading").style.display = "none";
        if (!data || !data.ok) return;

        // Aggiorna Profilo Utente
        if (data.user) {
          document.getElementById("megoinVal").innerText = data.user.megoin;
          document.getElementById("puntiVal").innerText = data.user.punti;
          document.getElementById("userPlan").innerText = "Piano: " + data.user.piano;
        }

        // Aggiorna Scheda Eroe
        if (data.hero) {
          const h = data.hero;
          document.getElementById("heroClass").innerText = (h.classe || "Avventuriero");
          document.getElementById("hpText").innerText = h.pv + " / " + h.pvMax;
          const pct = Math.max(0, Math.min(100, Math.round((h.pv / h.pvMax) * 100)));
          document.getElementById("hpBar").style.width = pct + "%";

          document.getElementById("heroFor").innerText = (h.stats && h.stats.FORZA) || 10;
          document.getElementById("heroDes").innerText = (h.stats && h.stats.DESTREZZA) || 10;
          document.getElementById("heroInt").innerText = (h.stats && h.stats.INTELLIGENZA) || 10;
          document.getElementById("heroOro").innerText = (h.oro || 0) + " 🟡";
        }
      })
      .catch(err => {
        document.getElementById("loading").style.display = "none";
        console.error("Errore fetch GAS:", err);
      });
    }

    function closeApp() {
      if (tg) tg.close();
    }

    window.onload = loadDataFromGAS;
  </script>
</body>
</html>
