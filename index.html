<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Estiqatsy Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: var(--tg-theme-bg-color, #121212);
      color: var(--tg-theme-text-color, #ffffff);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      background-color: var(--tg-theme-secondary-bg-color, #1e1e1e);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .btn-primary {
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen pb-20 select-none">

  <!-- SCHERMATA DI CARICAMENTO (CON TIMEOUT DI SICUREZZA) -->
  <div id="loading-overlay" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#121212] p-6 text-center">
    <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
    <div class="text-sm font-bold text-gray-200" id="loading-text">Connessione al database Estiqatsy...</div>
    <div id="error-box" class="hidden mt-4 p-3 bg-red-900/50 border border-red-500 rounded-lg text-xs text-red-200 max-w-sm text-left font-mono"></div>
    <button id="retry-btn" onclick="location.reload()" class="hidden mt-4 px-4 py-2 bg-blue-600 rounded-lg text-xs font-bold">Riprova Connessione</button>
  </div>

  <!-- BARRA UTENTE SUPERIORE -->
  <header class="p-4 card rounded-b-2xl shadow-lg sticky top-0 z-40 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center font-bold text-lg" id="userAvatar">E</div>
      <div>
        <h1 class="text-sm font-bold" id="userName">Utente</h1>
        <span class="text-xs text-blue-400 font-medium" id="userPlan">Piano Free</span>
      </div>
    </div>
    <div class="text-right">
      <div class="text-xs text-gray-400">Saldo</div>
      <div class="text-sm font-extrabold text-yellow-400" id="userMegoin">0 🪙</div>
    </div>
  </header>

  <!-- CONTENUTI -->
  <main class="p-4 flex-1">
    
    <!-- SEZIONE GIOCHI -->
    <section id="tab-games" class="space-y-4">
      <h2 class="text-lg font-black tracking-wide flex items-center">🎮 LE TUE AVVENTURE</h2>
      <div id="games-container" class="space-y-3">
        <div class="text-center py-6 text-gray-400 text-xs">Caricamento storie...</div>
      </div>
    </section>

    <!-- SEZIONE SHOP -->
    <section id="tab-shop" class="space-y-4 hidden">
      <h2 class="text-lg font-black tracking-wide flex items-center">🏪 SHOP UFFICIALE</h2>
      <div id="shop-container" class="grid grid-cols-2 gap-3">
        <div class="col-span-2 text-center py-6 text-gray-400 text-xs">Caricamento articoli...</div>
      </div>
    </section>

    <!-- SEZIONE RICETTE -->
    <section id="tab-recipes" class="space-y-4 hidden">
      <h2 class="text-lg font-black tracking-wide flex items-center">🍽️ RICETTE & COCKTAILS</h2>
      <div id="recipes-container" class="space-y-3">
        <div class="text-center py-6 text-gray-400 text-xs">Caricamento ricette...</div>
      </div>
    </section>

    <!-- SEZIONE PROFILO -->
    <section id="tab-profile" class="space-y-4 hidden">
      <h2 class="text-lg font-black tracking-wide flex items-center">👤 IL TUO PROFILO</h2>
      <div class="card p-4 rounded-xl space-y-3">
        <div class="flex justify-between py-2 border-b border-gray-800">
          <span class="text-gray-400 text-xs">ID Account</span>
          <span class="font-mono text-xs font-bold" id="profileChatId">-</span>
        </div>
        <div class="flex justify-between py-2 border-b border-gray-800">
          <span class="text-gray-400 text-xs">Username</span>
          <span class="text-xs font-bold" id="profileUsername">-</span>
        </div>
        <div class="flex justify-between py-2">
          <span class="text-gray-400 text-xs">Punti Fedeltà</span>
          <span class="text-xs font-bold text-green-400" id="profilePunti">0 Pt</span>
        </div>
      </div>
    </section>

  </main>

  <!-- BARRA NAVIGAZIONE INFERIORE -->
  <nav class="fixed bottom-0 left-0 right-0 card border-t border-gray-800 flex justify-around p-2 z-40">
    <button onclick="switchTab('games')" class="nav-btn flex flex-col items-center p-2 text-blue-400" data-tab="games">
      <span class="text-xl">🎮</span>
      <span class="text-[10px] font-bold">Giochi</span>
    </button>
    <button onclick="switchTab('shop')" class="nav-btn flex flex-col items-center p-2 text-gray-400" data-tab="shop">
      <span class="text-xl">🏪</span>
      <span class="text-[10px] font-bold">Shop</span>
    </button>
    <button onclick="switchTab('recipes')" class="nav-btn flex flex-col items-center p-2 text-gray-400" data-tab="recipes">
      <span class="text-xl">🍽️</span>
      <span class="text-[10px] font-bold">Ricette</span>
    </button>
    <button onclick="switchTab('profile')" class="nav-btn flex flex-col items-center p-2 text-gray-400" data-tab="profile">
      <span class="text-xl">👤</span>
      <span class="text-[10px] font-bold">Profilo</span>
    </button>
  </nav>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyeCWHM9X4ycwWT7IOMwg24pySL78bJT5BRyiIR5eb0UJALWuaORzfJ2lkqLrjLv0xN/exec";
    const tg = window.Telegram ? window.Telegram.WebApp : null;

    if (tg) {
      tg.expand();
      tg.ready();
    }

    function switchTab(tabKey) {
      if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
      document.querySelectorAll("main > section").forEach(el => el.classList.add("hidden"));
      document.getElementById("tab-" + tabKey).classList.remove("hidden");
      document.querySelectorAll(".nav-btn").forEach(btn => {
        if (btn.dataset.tab === tabKey) {
          btn.classList.remove("text-gray-400");
          btn.classList.add("text-blue-400");
        } else {
          btn.classList.add("text-gray-400");
          btn.classList.remove("text-blue-400");
        }
      });
    }

    async function fetchAPI(action) {
      const initData = (tg && tg.initData) ? tg.initData : "";
      const url = `${GAS_API_URL}?action=${action}&initData=${encodeURIComponent(initData)}`;
      
      const response = await fetch(url);
      const text = await response.text();
      
      try {
        const json = JSON.parse(text);
        return json.data;
      } catch (err) {
        throw new Error("Risposta non valida da Google Apps Script: " + text.substring(0, 100));
      }
    }

    async function initApp() {
      // Timeout di sicurezza: se dopo 8 secondi non risponde, mostra il pannello di debug
      const timeout = setTimeout(() => {
        document.getElementById("loading-text").textContent = "Tempo scaduto per la connessione";
        const errBox = document.getElementById("error-box");
        errBox.textContent = "Verifica di aver creato una 'Nuova Versione' nella distribuzione di Apps Script.";
        errBox.classList.remove("hidden");
        document.getElementById("retry-btn").classList.remove("hidden");
      }, 8000);

      try {
        // Carica il profilo
        const user = await fetchAPI("profile");
        if (user) {
          document.getElementById("userName").textContent = user.nome;
          document.getElementById("userAvatar").textContent = (user.nome || "U").charAt(0).toUpperCase();
          document.getElementById("userPlan").textContent = "Piano " + user.piano;
          document.getElementById("userMegoin").textContent = user.saldoMegoin + " 🪙";
          document.getElementById("profileChatId").textContent = user.chatId;
          document.getElementById("profileUsername").textContent = user.username;
          document.getElementById("profilePunti").textContent = user.puntiFedelta + " Pt";
        }

        // Carica Giochi
        fetchAPI("games").then(gamesData => {
          const c = document.getElementById("games-container");
          if (gamesData && gamesData.games && gamesData.games.length > 0) {
            c.innerHTML = gamesData.games.map(g => `
              <div class="card p-4 rounded-xl flex justify-between items-center">
                <div>
                  <h3 class="font-bold text-sm">${g.titolo}</h3>
                  <p class="text-xs text-gray-400">${g.episodi.length} Episodi</p>
                </div>
                <button onclick="if(tg) tg.close();" class="btn-primary px-3 py-1.5 rounded-lg text-xs font-bold">Gioca sul Bot</button>
              </div>
            `).join("");
          } else {
            c.innerHTML = "<div class='text-xs text-gray-500 py-4 text-center'>Nessuna serie attiva al momento.</div>";
          }
        });

        // Carica Shop
        fetchAPI("shop").then(shopData => {
          const sc = document.getElementById("shop-container");
          if (shopData && shopData.items && shopData.items.length > 0) {
            sc.innerHTML = shopData.items.map(p => `
              <div class="card p-3 rounded-xl flex flex-col justify-between">
                <div>
                  <div class="text-[9px] text-blue-400 uppercase font-bold">${p.categoria}</div>
                  <h4 class="font-bold text-xs mt-1 line-clamp-1">${p.nome}</h4>
                </div>
                <div class="mt-3 flex justify-between items-center">
                  <span class="text-xs font-bold text-yellow-400">${p.prezzoMegoin} 🪙</span>
                  <button class="btn-primary px-2 py-1 rounded text-[10px] font-bold">Acquista</button>
                </div>
              </div>
            `).join("");
          }
        });

        // Carica Ricette
        fetchAPI("recipes").then(recData => {
          const rc = document.getElementById("recipes-container");
          if (recData && recData.recipes && recData.recipes.length > 0) {
            rc.innerHTML = recData.recipes.map(r => `
              <div class="card p-3 rounded-xl flex justify-between items-center">
                <div>
                  <h4 class="font-bold text-xs">${r.piatto}</h4>
                  <span class="text-[10px] text-gray-400">${r.categoria} • ⏱️ ${r.tempo}</span>
                </div>
                <span class="text-xs text-blue-400 font-bold">${r.costo}</span>
              </div>
            `).join("");
          }
        });

        clearTimeout(timeout);
        // Nascondi la schermata di caricamento
        document.getElementById("loading-overlay").classList.add("hidden");

      } catch (err) {
        clearTimeout(timeout);
        document.getElementById("loading-text").textContent = "Errore di connessione";
        const errBox = document.getElementById("error-box");
        errBox.textContent = err.message;
        errBox.classList.remove("hidden");
        document.getElementById("retry-btn").classList.remove("hidden");
      }
    }

    window.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>
</html>
